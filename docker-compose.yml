# 仅 app 一个服务：80/443 由宿主机已有的 HAProxy + Caddy 负责，
# 不要再启动 Caddy 容器，也不要把 3000 发布到 0.0.0.0。
services:
  app:
    build: .
    image: my-rsc-app:${APP_VERSION:-dev}
    container_name: my-rsc-app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      APP_VERSION: ${APP_VERSION:-dev}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
